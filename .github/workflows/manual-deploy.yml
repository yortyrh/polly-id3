name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  STAGE: ${{ vars.STAGE }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}
  VOICE_ID: ${{ vars.VOICE_ID }}
  LANGUAGE_CODE: ${{ vars.LANGUAGE_CODE }}
  POLLY_ENGINE: ${{ vars.POLLY_ENGINE }}
  TEXT_TYPE: ${{ vars.TEXT_TYPE }}
  MAX_RETRY_ATTEMPTS: ${{ vars.MAX_RETRY_ATTEMPTS }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}


jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Deploy
        run: |
          echo "Deploying to ${{ env.STAGE }}, with verbose: ${{ github.event.inputs.verbose }}"
          if [ "${{ github.event.inputs.verbose }}" = "true" ]; then
            npm run deploy -- --verbose
          else
            npm run deploy
          fi
        env:
          # get aws variables from secrets
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          SERVERLESS_ACCESS_KEY: ${{ env.SERVERLESS_ACCESS_KEY }}
          
          # get variables from variables
          STAGE: ${{ env.STAGE }}
          S3_BUCKET_NAME: ${{ env.S3_BUCKET_NAME }}
          SNS_TOPIC_ARN: ${{ env.SNS_TOPIC_ARN }}
          VOICE_ID: ${{ env.VOICE_ID }}
          LANGUAGE_CODE: ${{ env.LANGUAGE_CODE }}
          POLLY_ENGINE: ${{ env.POLLY_ENGINE }}
          TEXT_TYPE: ${{ env.TEXT_TYPE }}
          MAX_RETRY_ATTEMPTS: ${{ env.MAX_RETRY_ATTEMPTS }}
          
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to ${{ env.STAGE }} completed successfully!"
          else
            echo "❌ Deployment to ${{ env.STAGE }} failed!"
            exit 1
          fi
