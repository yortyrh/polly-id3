name: Status Check

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  status:
    name: Update Status
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate status badge
      run: |
        echo "Generating status badge..."
        echo "CI Status: ${{ github.event.workflow_run.conclusion }}"
        
        # Create a simple status file
        cat > status.md << EOF
        # Project Status
        
        ## CI/CD Pipeline
        - **Last Run:** ${{ github.event.workflow_run.created_at }}
        - **Status:** ${{ github.event.workflow_run.conclusion }}
        - **Branch:** ${{ github.event.workflow_run.head_branch }}
        - **Commit:** ${{ github.event.workflow_run.head_sha }}
        
        ## Quick Links
        - [View Latest Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }})
        - [View All Workflows](https://github.com/${{ github.repository }}/actions)
        
        ---
        *Auto-generated by GitHub Actions*
        EOF
        
    - name: Commit status update
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add status.md
        git commit -m "Update CI status: ${{ github.event.workflow_run.conclusion }}" || echo "No changes to commit"
        git push || echo "No changes to push"
